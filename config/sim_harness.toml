# sim_harness配置

[paths]
# kin_pad 根（含 pyproject.toml）
kin_pad_root = "kin_pad"
# 新机型原型目录（三端 diff 的 save/{model}.py 与插件所在）
save_dir = "kin_pad/save"
# UE 演示 Actor 源（三端 diff 第三端）
lambda_spool_cpp = "PID/Plugins/XtalScene/Source/XtalScene/Private/kin/LambdaSpool.cpp"
# HTE 设备档案 JSON（2026-11-10 修正：旧值 PID/HTE设备介绍.json 磁盘不存在，
# 真实档案为下值；C++ 插件 Hte.BrushSlots 省略 JsonPath 时的默认路径同样过时，故调用必显式传路径）
hte_json = "PID/Docs/HTE.json"
# 编排证据/草稿工作区（非业务目录，落盘业务产物需人审）
work_dir = "lab_atuo_inteller/_work"

[nl]
# ReAct 环 skill 注入目录
skills_dir = "skills"

[unreal]
# EngineWire 原生 MCP（PID 编辑器内插件，单 unreal 网关工具；官方插件/lab_simmer 旧路已弃）
endpoint = "http://127.0.0.1:3000/mcp"
# capability token 文件（EngineWire 首启自动生成 64 hex；按本机 PID 工程位置改，per-machine 配置）
token_file = "D:/project/PID/Saved/MCP/capability-token"
# UE 步骤（刷槽位/装载）默认关；验证时显式开
run_ue_steps = false

[blender]
# Blender MCP（stdio）启动命令行（空格分词）；留空 = 未配置：blender_* 工具不装配、
# 资产图的 live_blender 不可用（场景走导出 JSON 文件流，管线不受影响）。
# 当前 = vendor 版 mcp-for-blender（_work/vendor/blender-mcp 已装 venv，启动器注入遥测关）；
# 适配层 export_scene_items 走其 execute_blender_code 注片段出契约 JSON。
# 前提：Blender 里 addon 面板已点 Connect（本进程只是 MCP↔socket:9876 的桥）。
command = "D:/project/kin_pad/.venv/Scripts/python.exe D:/project/lab_atuo_inteller/launch_blender_mcp.py"

[asset]
# 人审批准后草稿合入目录（空 = 批准也不复制，草稿留 asset_run 由人手工处理）；
# run_asset CLI 的 --merge-dir 优先于本配置
merge_dir = ""

[golden]
run_golden = true


[llm]
# 联调/生产（5090 vLLM，跨机 HTTP）——当前生效（2026-11-03 切）
base_url = "http://10.249.21.47:8000/v1"
#model = "Qwen/Qwen2.5-32B-Instruct-AWQ"
model = "tclf90/Qwen3-VL-30B-A3B-Instruct-AWQ"
api_key = "EMPTY"
# VL 总闸：多模态模型 = true（ReAct 图截图带图回喂，模型真"看到"视口）；
vision = true

# （5060 Ollama；取消注释并注释上面三行；qwen2.5 纯文本，vision 须改 false）
