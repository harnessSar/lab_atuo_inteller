# 本地推理零许可费；仅云端 API 按 token 计费。
# 切换只改 base_url/model，图与工具不变。
# ---------------------------------------------------------------------------
[llm]
# 联调/生产（5090 vLLM，跨机 HTTP）——当前生效（2026-11-03 切）
base_url = "http://10.249.21.47:8000/v1"
#model = "Qwen/Qwen2.5-32B-Instruct-AWQ"
model = "tclf90/Qwen3-VL-30B-A3B-Instruct-AWQ"
api_key = "EMPTY"
# VL 总闸：多模态模型 = true（nl_graph 截图带图回喂，模型真"看到"视口）；
